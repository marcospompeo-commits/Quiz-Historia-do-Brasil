<script>
const phases = [{"name":"Período Colonial","dates":"1500–1822","questions":[["Em que ano os portugueses chegaram ao território que hoje chamamos Brasil?",["1492","1500","1530","1600"],1,"A chegada da frota comandada por Pedro Álvares Cabral ocorreu em 1500. Povos indígenas já habitavam o território havia milhares de anos.","Pense na ordem dos acontecimentos históricos desse período e tente lembrar o marco cronológico."],["Qual produto marcou o início da exploração econômica portuguesa no litoral?",["Café","Borracha","Pau-brasil","Ouro"],2,"O pau-brasil foi explorado principalmente no litoral, com participação e trabalho de povos indígenas.","Considere a economia e as relações de trabalho predominantes no período."],["Como eram chamadas as grandes divisões administrativas criadas por Portugal em 1534?",["Capitanias hereditárias","Províncias imperiais","Estados gerais","Repúblicas"],0,"As capitanias hereditárias foram concedidas a donatários, embora muitas tenham enfrentado dificuldades.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual cidade foi a primeira capital do Brasil colonial?",["Rio de Janeiro","Salvador","São Paulo","Recife"],1,"Salvador tornou-se a capital em 1549. A capital foi transferida para o Rio de Janeiro em 1763.","Use as pistas geográficas e lembre-se de como a ocupação do território mudou ao longo do tempo."],["Qual atividade econômica teve grande importância no Nordeste colonial?",["Produção de açúcar","Indústria automobilística","Extração de borracha","Cultivo de trigo em larga escala"],0,"A produção açucareira, baseada em grandes propriedades e no trabalho escravizado, teve grande importância.","Considere a economia e as relações de trabalho predominantes no período."],["Qual foi a principal mão de obra forçada usada nas grandes plantações coloniais?",["Trabalho assalariado universal","Trabalho escravizado de africanos e seus descendentes","Serviço militar obrigatório","Trabalho exclusivamente de imigrantes europeus"],1,"A escravidão de africanos e seus descendentes foi central na economia colonial e deixou profundas consequências sociais.","Considere a economia e as relações de trabalho predominantes no período."],["O que eram as entradas e bandeiras, em linhas gerais?",["Expedições pelo interior","Eleições coloniais","Leis de comércio marítimo","Festas religiosas"],0,"Expedições avançaram pelo interior por diferentes motivos, incluindo busca por metais, captura de indígenas e expansão territorial.","Tente explicar o conceito com suas próprias palavras antes de escolher a alternativa."],["Em que região ocorreu a corrida do ouro no final do século XVII e início do XVIII?",["Amazônia ocidental","Minas Gerais","Litoral do Amapá","Pampa gaúcho"],1,"A descoberta de ouro impulsionou a ocupação de áreas que hoje fazem parte de Minas Gerais.","Use as pistas geográficas e lembre-se de como a ocupação do território mudou ao longo do tempo."],["Em que ano a família real portuguesa chegou ao Brasil, fugindo das tropas de Napoleão?",["1808","1822","1889","1750"],0,"A corte portuguesa chegou em 1808, promovendo mudanças administrativas, econômicas e culturais.","Pense na ordem dos acontecimentos históricos desse período e tente lembrar o marco cronológico."],["Qual medida de 1808 permitiu o comércio direto do Brasil com nações amigas de Portugal?",["Lei Áurea","Abertura dos portos","Ato Institucional nº 5","Constituição republicana"],1,"A abertura dos portos rompeu parte do antigo exclusivo comercial colonial.","Pense na finalidade do documento, da lei ou da instituição e no contexto em que surgiu."],["Qual povo indígena habitava grande parte do litoral quando os portugueses chegaram?",["Tupinambá e outros povos de língua tupi","Vikings","Romanos","Incas em todo o litoral"],0,"Havia muitos povos indígenas distintos no território, com línguas e culturas diversas.","Pense na ordem dos acontecimentos históricos desse período e tente lembrar o marco cronológico."],["O que era o escambo no início da colonização?",["Troca de produtos e trabalho por mercadorias","Um imposto sobre o ouro","Uma eleição municipal","Uma moeda de prata"],0,"O escambo envolvia trocas entre europeus e indígenas, especialmente na exploração do pau-brasil.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Quem foi o primeiro governador-geral do Brasil?",["Tomé de Sousa","Mem de Sá","Martim Afonso de Sousa","D. João VI"],0,"Tomé de Sousa chegou em 1549 para organizar o governo-geral e fundou Salvador como capital.","Lembre-se das figuras históricas associadas a esse acontecimento; diferencie líderes, governantes e participantes."],["Em que ano foi fundada a cidade de Salvador?",["1549","1500","1763","1624"],0,"Salvador foi fundada em 1549 e tornou-se sede do governo-geral.","Pense na ordem dos acontecimentos históricos desse período e tente lembrar o marco cronológico."],["Qual ordem religiosa teve papel importante na catequização colonial?",["Companhia de Jesus","Ordem dos Templários","Cavaleiros Teutônicos","Ordem do Dragão"],0,"Os jesuítas atuaram em missões, educação e catequização, em meio a conflitos e relações desiguais.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual era o objetivo principal das missões jesuíticas?",["Catequizar e reunir comunidades indígenas","Eleger governadores","Criar fábricas modernas","Declarar a Independência"],0,"As missões buscavam converter indígenas ao cristianismo e reorganizar suas comunidades.","Tente explicar o conceito com suas próprias palavras antes de escolher a alternativa."],["Qual invasão estrangeira ocupou partes do Nordeste no século XVII?",["Invasão holandesa","Invasão japonesa","Invasão russa","Invasão canadense"],0,"Os holandeses ocuparam áreas do Nordeste, especialmente Pernambuco, entre 1630 e 1654.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Quem governou o Brasil holandês em Pernambuco e ficou associado a obras urbanas?",["Maurício de Nassau","Tiradentes","Duque de Caxias","José Bonifácio"],0,"Maurício de Nassau administrou a região ocupada pelos holandeses entre 1637 e 1644.","Lembre-se das figuras históricas associadas a esse acontecimento; diferencie líderes, governantes e participantes."],["Qual foi uma consequência da mineração no século XVIII?",["Crescimento urbano no interior","Fim imediato da escravidão","Proclamação da República","Transferência da capital para Brasília"],0,"A mineração estimulou vilas, comércio e deslocamentos populacionais para o interior.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["O que era o quinto do ouro?",["Imposto de 20% sobre o ouro extraído","Um prêmio aos mineradores","Uma moeda indígena","Um tratado com a Espanha"],0,"O quinto correspondia a um quinto da produção de ouro destinado à Coroa portuguesa.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["O que eram as Casas de Fundição?",["Locais onde o ouro era fundido e tributado","Escolas de navegação","Tribunais eleitorais","Portos militares"],0,"As Casas de Fundição ajudavam a controlar e cobrar impostos sobre o ouro.","Tente explicar o conceito com suas próprias palavras antes de escolher a alternativa."],["Qual movimento de 1789 ocorreu em Minas Gerais?",["Inconfidência Mineira","Revolta da Vacina","Cabanagem","Revolução de 1930"],0,"A Inconfidência Mineira foi um movimento conspiratório contra a dominação portuguesa e a cobrança de impostos.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual personagem ficou conhecido como Tiradentes?",["Joaquim José da Silva Xavier","José Bonifácio","Bento Gonçalves","Padre Cícero"],0,"Tiradentes participou da Inconfidência Mineira e foi executado em 1792.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual revolta de 1798 ocorreu na Bahia e defendia ideias republicanas?",["Conjuração Baiana","Balaiada","Sabinada","Revolta da Chibata"],0,"A Conjuração Baiana teve participação popular e defendia mudanças sociais e políticas.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual foi um dos efeitos da transferência da corte portuguesa em 1808?",["Criação de instituições e abertura de atividades econômicas","Fim da monarquia imediatamente","Abolição da escravidão","Início da ditadura militar"],0,"A presença da corte levou à criação de instituições, imprensa e mudanças administrativas.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual instituição cultural foi criada no Rio de Janeiro em 1810?",["Biblioteca Real","TSE","Petrobras","Universidade de Brasília"],0,"A Biblioteca Real, trazida e organizada após a chegada da corte, contribuiu para a vida cultural.","Pense na finalidade do documento, da lei ou da instituição e no contexto em que surgiu."],["O que foi elevado a Reino Unido com Portugal em 1815?",["Brasil","Uruguai","Argentina","Angola"],0,"Em 1815, o Brasil foi elevado à condição de Reino Unido a Portugal e Algarves.","Tente explicar o conceito com suas próprias palavras antes de escolher a alternativa."],["Quem era o príncipe regente que permaneceu no Brasil em 1822?",["D. Pedro","D. Miguel","D. João VI","D. Pedro II"],0,"D. Pedro permaneceu no Brasil após o retorno de D. João VI a Portugal.","Lembre-se das figuras históricas associadas a esse acontecimento; diferencie líderes, governantes e participantes."],["O que significou o Dia do Fico, em janeiro de 1822?",["D. Pedro decidiu permanecer no Brasil","A abolição da escravidão","A fundação de Brasília","A proclamação da República"],0,"D. Pedro anunciou que ficaria no Brasil, contrariando ordens das Cortes portuguesas.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual atividade usou intensamente mão de obra escravizada nas regiões mineradoras?",["Extração de ouro","Produção de computadores","Indústria de automóveis","Cultivo de soja mecanizado"],0,"A mineração colonial também dependia amplamente do trabalho escravizado.","Considere a economia e as relações de trabalho predominantes no período."],["O que foi o sistema de plantation?",["Grande propriedade com monocultura voltada à exportação","Pequena indústria urbana","Sistema de eleições","Rede de escolas públicas"],0,"Plantation é associado a grandes propriedades, monocultura e trabalho coercitivo, frequentemente escravizado.","Tente explicar o conceito com suas próprias palavras antes de escolher a alternativa."],["Qual cultura agrícola ganhou destaque no Maranhão e Grão-Pará em diferentes períodos coloniais?",["Algodão e arroz","Cacau exclusivamente industrial","Café em estufas","Trigo em larga escala no sertão"],0,"Algodão e arroz tiveram importância econômica em áreas do Norte e Nordeste colonial.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual tratado de 1750 redefiniu fronteiras entre Portugal e Espanha na América?",["Tratado de Madri","Tratado de Versalhes","Tratado de Tordesilhas de 1494","Tratado de Utrecht de 1919"],0,"O Tratado de Madri procurou ajustar fronteiras com base na ocupação efetiva de territórios.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual tratado de 1494 dividiu áreas de expansão ultramarina entre Portugal e Espanha?",["Tratado de Tordesilhas","Tratado de Madri","Tratado de Paris","Tratado de Petrópolis"],0,"O Tratado de Tordesilhas estabeleceu uma linha de demarcação entre as áreas reivindicadas pelas coroas ibéricas.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual foi uma consequência do tráfico atlântico de pessoas escravizadas?",["Diáspora africana e profundas consequências sociais","Fim das desigualdades","Industrialização imediata","Independência em 1500"],0,"O tráfico provocou deslocamentos forçados em massa e marcou profundamente a sociedade brasileira.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual região foi central na produção açucareira colonial?",["Nordeste, especialmente Pernambuco e Bahia","Planalto Central","Pampa","Vale do Itajaí exclusivamente"],0,"Pernambuco e Bahia foram importantes centros açucareiros.","Use as pistas geográficas e lembre-se de como a ocupação do território mudou ao longo do tempo."],["Qual era a função dos engenhos de açúcar?",["Processar a cana para produzir açúcar","Fundir ouro","Construir navios de guerra","Imprimir papel-moeda"],0,"Os engenhos reuniam instalações para moer a cana e fabricar açúcar.","Tente explicar o conceito com suas próprias palavras antes de escolher a alternativa."],["O que foi a Guerra dos Emboabas?",["Conflito ligado ao controle das áreas de mineração","Guerra pela Independência em 1822","Conflito da República Velha","Guerra do Paraguai"],0,"A disputa envolveu paulistas e outros grupos pelo controle das minas no início do século XVIII.","Tente explicar o conceito com suas próprias palavras antes de escolher a alternativa."],["Qual revolta ocorreu no Maranhão entre 1838 e 1841, já no período regencial?",["Balaiada","Inconfidência Mineira","Conjuração Baiana","Revolta da Vacina"],0,"A Balaiada ocorreu no período regencial, após a Independência, e não durante o período colonial.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual foi uma característica do pacto colonial?",["A metrópole controlava o comércio da colônia","A colônia tinha plena autonomia comercial","Não havia impostos","O Brasil controlava Portugal"],0,"O sistema colonial buscava beneficiar a metrópole e restringir o comércio colonial.","Tente explicar o conceito com suas próprias palavras antes de escolher a alternativa."],["Qual cidade tornou-se capital antes e participantes."],["Qual foi a principal língua oficial da administração colonial portuguesa?",["Português","Tupi antigo exclusivamente","Latim","Holandês"],0,"O português foi a língua da administração colonial, embora muitas línguas indígenas continuassem vivas e usadas.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."],["Qual instituição representava o poder local em muitas vilas coloniais?",["Câmara municipal","Supremo Tribunal Federal","Congresso Nacional republicano","Banco Central"],0,"As câmaras municipais eram instituições locais de governo, geralmente dominadas por elites.","Pense na finalidade do documento, da lei ou da instituição e no contexto em que surgiu."],["O que eram sesmarias?",["Concessões de terras para ocupação e cultivo","Impostos sobre o ouro","Navios de guerra","Cartas de alforria"],0,"Sesmarias eram concessões de terras usadas pela Coroa para estimular ocupação e produção.","Tente explicar o conceito com suas próprias palavras antes de escolher a alternativa."],["Qual evento marcou o fim do período colonial e a separação política de Portugal?",["Independência do Brasil em 1822","Proclamação da República em 1889","Abolição em 1888","Constituição de 1988"],0,"A Independência de 1822 marcou a ruptura política, embora estruturas sociais coloniais tenham permanecido.","Pense nas relações entre a Coroa portuguesa, os povos indígenas e a sociedade colonial."]]},{"name":"Império do Brasil","dates":"1822–1889","questions":[["Em que ano foi proclamada a Independência do Brasil?",["1808","1822","1831","1889"],1,"A Independência foi proclamada em 7 de setembro de 1822, sob liderança de Pedro de Alcântara, futuro D. Pedro I.","Pense na ordem dos acontecimentos históricos desse período e tente lembrar o marco cronológico."],["Quem foi o primeiro imperador do Brasil?",["D. Pedro I","D. Pedro II","Deodoro da Fonseca","José Bonifácio"],0,"D. Pedro I foi o primeiro imperador e abdicou do trono em 1831.","Lembr let phase=0,idx=0,score=0,lives=4,selected=-1,locked=false,phaseCorrect=0;
let phaseUnlocked=[true,false,false],roundQuestions=[],phaseResults=[null,null,null];
const $=id=>document.getElementById(id);
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawQuestions(){roundQuestions=shuffle(phases[phase].questions).slice(0,10)}
function render(){
 const p=phases[phase],q=roundQuestions[idx];selected=-1;locked=false;
 $("phaseLabel").textContent=`Fase ${phase+1} — ${p.name}`;
 $("question").textContent=q[0];$("progress").textContent=`${idx+1}/10`; $("hintText").textContent=""; $("hintText").classList.add("hidden"); $("hintBtn").disabled=false;
 $("score").textContent=score;$("lives").textContent=lives;$("answers").replaceChildren();
 q[1].forEach((answer,i)=>{const b=document.createElement("button");b.type="button";b.className="answer";const letter=document.createElement("span");letter.className="letter";letter.textContent="ABCD"[i];const label=document.createElement("span");label.textContent=answer;b.append(letter,label);b.addEventListener("click",()=>choose(i));$("answers").appendChild(b)});
 $("feedback").textContent="Escolha uma alternativa e toque em “Confirmar resposta”.";
 $("confirmBtn").classList.remove("hidden");$("confirmBtn").disabled=true;$("nextBtn").classList.add("hidden");$("phaseBtn").classList.add("hidden");$("stopBtn").classList.add("hidden");$("restartBtn").classList.add("hidden");
 $("backBtn").disabled=idx===0&&phase===0;
 document.querySelectorAll(".phase").forEach((b,i)=>{b.classList.toggle("active",i===phase);b.disabled=!phaseUnlocked[i];b.innerHTML=`Fase ${i+1}<br>${phases[i].name}${phaseUnlocked[i]?"":" 🔒"}`});
}
function choose(i){if(locked)return;selected=i;[...$("answers").children].forEach((b,j)=>b.classList.toggle("selected",i===j));$("confirmBtn").disabled=false}
function confirmAnswer(){
 if(selected<0||locked)return;
 locked=true;
 const q=roundQuestions[idx],ok=selected===q[2];
 [...$("answers").children].forEach((b,i)=>{
   b.disabled=true;
   if(i===q[2])b.classList.add("correct");
   if(i===selected&&!ok)b.classList.add("wrong");
 });
 if(ok){
   score+=10;phaseCorrect++;
   $("feedback").textContent="✅ Correto! "+q[3];
 }else{
   lives--;
   $("feedback").textContent="❌ Resposta correta: "+q[1][q[2]]+". "+q[3];
 }
 $("score").textContent=score;
 $("lives").textContent=lives;
 $("confirmBtn").classList.add("hidden");
 if(lives<=0){
   phaseResults[phase]={correct:phaseCorrect,score:phaseCorrect*10,percent:phaseCorrect*10,passed:phaseCorrect>=7};
   $("feedback").textContent+=" Você ficou sem vidas. Resultado desta tentativa: "+phaseCorrect+"/10. Você pode refazer a fase.";
   $("restartBtn").textContent="Refazer esta fase";
   $("restartBtn").classList.remove("hidden");
   return;
 }
 if(idx<9){
   $("nextBtn").classList.remove("hidden");
 }else{
   finishPhase();
 }
}
function finishPhase(){
 const passed=phaseCorrect>=7;
 phaseResults[phase]={correct:phaseCorrect,score:phaseCorrect*10,percent:phaseCorrect*10,passed};
 const scoreText=`Fase ${phase+1}: ${phaseCorrect}/10 acertos — ${phaseCorrect*10}%.`;
 if(!passed){
   $("feedback").textContent=scoreText+" Você precisa de pelo menos 7 acertos (70%) para avançar. Quer tentar esta fase novamente?";
   $("restartBtn").textContent="Refazer esta fase";
   $("restartBtn").classList.remove("hidden");
   return;
 }
 if(phase<2){
   phaseUnlocked[phase+1]=true;
   $("feedback").textContent=scoreText+" Você atingiu a média! Quer continuar para a próxima fase ou encerrar por aqui e ver seu resultado?";
   $("phaseBtn").textContent="Continuar para a próxima fase →";
   $("phaseBtn").classList.remove("hidden");
   $("stopBtn").classList.remove("hidden");
 }else{
   showFinalResults();
 }
}
function showFinalResults(){
 const completed=phaseResults.filter(Boolean);
 const totalCorrect=completed.reduce((sum,r)=>sum+r.correct,0);
 const average=completed.length ? Math.round(completed.reduce((sum,r)=>sum+r.percent,0)/completed.length) : 0;
 const lines=phaseResults.map((r,i)=>r?`Fase ${i+1}: ${r.correct}/10 (${r.percent}%)`:`Fase ${i+1}: não realizada`);
 $("phaseLabel").textContent="Resultado da jornada";
 $("question").textContent="Parabéns por jogar!";
 $("answers").replaceChildren();
 $("feedback").textContent=lines.join(" • ") + ` | Média das fases concluídas: ${average}% (${totalCorrect} acertos no total).`;
 $("confirmBtn").classList.add("hidden");
 $("nextBtn").classList.add("hidden");
 $("phaseBtn").classList.add("hidden");
 $("stopBtn").classList.add("hidden");
 $("restartBtn").textContent="Jogar novamente";
 $("restartBtn").classList.remove("hidden");
}
function stopAndShowResults(){
 showFinalResults();
}
function next(){if(idx<9){idx++;render()}}
function nextPhase(){phase++;idx=0;lives=4;phaseCorrect=0;drawQuestions();render()}
$("hintBtn").addEventListener("click",()=>{const q=roundQuestions[idx];$("hintText").textContent="💡 "+q[4];$("hintText").classList.remove("hidden");$("hintBtn").disabled=true});
$("confirmBtn").addEventListener("click",confirmAnswer);$("nextBtn").addEventListener("click",next);$("phaseBtn").addEventListener("click",nextPhase);$("stopBtn").addEventListener("click",stopAndShowResults);
$("backBtn").addEventListener("click",()=>{if(idx>0){idx--;render()}else if(phase>0){phase--;idx=9;render()}});
$("restartBtn").addEventListener("click",()=>{phase=0;idx=0;score=0;lives=4;phaseCorrect=0;phaseUnlocked=[true,false,false];phaseResults=[null,null,null];drawQuestions();render()});
$("helpBtn").addEventListener("click",()=>alert("Como jogar:\\n1. Escolha uma das quatro alternativas.\\n2. Confirme a resposta para ver a explicação.\\n3. Cada acerto vale 10 pontos.\\n4. Você tem 4 vidas por fase e precisa acertar pelo menos 7 das 10 perguntas para passar (70%). Ao final, escolha se quer continuar ou parar e ver o resultado. Ao concluir as três fases, o jogo calcula a média. A dica orienta sem revelar a resposta.\\n5. Cada partida sorteia 10 perguntas diferentes entre 50 da fase."));
document.querySelectorAll(".phase").forEach(b=>b.addEventListener("click",()=>{const n=Number(b.dataset.phase);if(phaseUnlocked[n]){phase=n;idx=0;lives=4;phaseCorrect=0;drawQuestions();render()}}));
drawQuestions();render();
</script></body></html>
