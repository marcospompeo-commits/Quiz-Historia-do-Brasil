<script>
const phases = [{"name":"Período Colonial","dates":"1500–1822","questions":[["Em que ano os portugueses chegaram ao território que hoje chamamos Brasil?",["1492","1500","1530","1600"],1,"A chegada da frota comandada por Pedro Álvares Cabral ocorreu em 1500. Povos indígenas já habitavam o território havia milhares de anos.","Pense no ano da expedição portuguesa que chegou à costa sul-americana no início do século XVI."],["Qual produto marcou o início da exploração econômica portuguesa no litoral?",["Café","Borracha","Pau-brasil","Ouro"],2,"O pau-brasil foi explorado principalmente no litoral, com participação e trabalho de povos indígenas.","Para resolver “Qual produto marcou o início da exploração econômica portuguesa no litoral”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Como eram chamadas as grandes divisões administrativas criadas por Portugal em 1534?",["Capitanias hereditárias","Províncias imperiais","Estados gerais","Repúblicas"],0,"As capitanias hereditárias foram concedidas a donatários, embora muitas tenham enfrentado dificuldades.","Eram grandes faixas de terra entregues a particulares, que deveriam ajudar a ocupar e administrar a colônia."],["Qual cidade foi a primeira capital do Brasil colonial?",["Rio de Janeiro","Salvador","São Paulo","Recife"],1,"Salvador tornou-se a capital em 1549. A capital foi transferida para o Rio de Janeiro em 1763.","Considere a cidade nordestina que concentrava o governo colonial antes da mudança para o Sudeste."],["Qual atividade econômica teve grande importância no Nordeste colonial?",["Produção de açúcar","Indústria automobilística","Extração de borracha","Cultivo de trigo em larga escala"],0,"A produção açucareira, baseada em grandes propriedades e no trabalho escravizado, teve grande importância.","Lembre-se dos engenhos, das grandes propriedades e da produção voltada ao mercado externo."],["Qual foi a principal mão de obra forçada usada nas grandes plantações coloniais?",["Trabalho assalariado universal","Trabalho escravizado de africanos e seus descendentes","Serviço militar obrigatório","Trabalho exclusivamente de imigrantes europeus"],1,"A escravidão de africanos e seus descendentes foi central na economia colonial e deixou profundas consequências sociais.","Considere quem foi submetido ao trabalho compulsório e como esse sistema sustentou a economia colonial."],["O que eram as entradas e bandeiras, em linhas gerais?",["Expedições pelo interior","Eleições coloniais","Leis de comércio marítimo","Festas religiosas"],0,"Expedições avançaram pelo interior por diferentes motivos, incluindo busca por metais, captura de indígenas e expansão territorial.","Eram expedições que avançavam para o interior, motivadas por diferentes objetivos econômicos e territoriais."],["Em que região ocorreu a corrida do ouro no final do século XVII e início do XVIII?",["Amazônia ocidental","Minas Gerais","Litoral do Amapá","Pampa gaúcho"],1,"A descoberta de ouro impulsionou a ocupação de áreas que hoje fazem parte de Minas Gerais.","Pense na região interiorana que cresceu rapidamente após descobertas de metais preciosos."],["Em que ano a família real portuguesa chegou ao Brasil, fugindo das tropas de Napoleão?",["1808","1822","1889","1750"],0,"A corte portuguesa chegou em 1808, promovendo mudanças administrativas, econômicas e culturais.","Reflita sobre o que muda quando a sede de uma monarquia passa a funcionar em sua colônia."],["Qual medida de 1808 permitiu o comércio direto do Brasil com nações amigas de Portugal?",["Lei Áurea","Abertura dos portos","Ato Institucional nº 5","Constituição republicana"],1,"A abertura dos portos rompeu parte do antigo exclusivo comercial colonial.","A medida reduziu as restrições do antigo sistema comercial exclusivo entre colônia e metrópole."],["Qual povo indígena habitava grande parte do litoral quando os portugueses chegaram?",["Tupinambá e outros povos de língua tupi","Vikings","Romanos","Incas em todo o litoral"],0,"Havia muitos povos indígenas distintos no território, com línguas e culturas diversas.","Para resolver “Qual povo indígena habitava grande parte do litoral quando os portugueses chegaram”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["O que era o escambo no início da colonização?",["Troca de produtos e trabalho por mercadorias","Um imposto sobre o ouro","Uma eleição municipal","Uma moeda de prata"],0,"O escambo envolvia trocas entre europeus e indígenas, especialmente na exploração do pau-brasil.","Para resolver “O que era o escambo no início da colonização”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Quem foi o primeiro governador-geral do Brasil?",["Tomé de Sousa","Mem de Sá","Martim Afonso de Sousa","D. João VI"],0,"Tomé de Sousa chegou em 1549 para organizar o governo-geral e fundou Salvador como capital.","Para resolver “Quem foi o primeiro governador-geral do Brasil”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Em que ano foi fundada a cidade de Salvador?",["1549","1500","1763","1624"],0,"Salvador foi fundada em 1549 e tornou-se sede do governo-geral.","Use a sequência cronológica dos acontecimentos brasileiros e elimine datas de períodos históricos muito diferentes."],["Qual ordem religiosa teve papel importante na catequização colonial?",["Companhia de Jesus","Ordem dos Templários","Cavaleiros Teutônicos","Ordem do Dragão"],0,"Os jesuítas atuaram em missões, educação e catequização, em meio a conflitos e relações desiguais.","Para resolver “Qual ordem religiosa teve papel importante na catequização colonial”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual era o objetivo principal das missões jesuíticas?",["Catequizar e reunir comunidades indígenas","Eleger governadores","Criar fábricas modernas","Declarar a Independência"],0,"As missões buscavam converter indígenas ao cristianismo e reorganizar suas comunidades.","Considere ordens religiosas que atuavam na catequese e na educação durante a colonização."],["Qual invasão estrangeira ocupou partes do Nordeste no século XVII?",["Invasão holandesa","Invasão japonesa","Invasão russa","Invasão canadense"],0,"Os holandeses ocuparam áreas do Nordeste, especialmente Pernambuco, entre 1630 e 1654.","Para resolver “Qual invasão estrangeira ocupou partes do Nordeste no século XVII”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Quem governou o Brasil holandês em Pernambuco e ficou associado a obras urbanas?",["Maurício de Nassau","Tiradentes","Duque de Caxias","José Bonifácio"],0,"Maurício de Nassau administrou a região ocupada pelos holandeses entre 1637 e 1644.","Para resolver “Quem governou o Brasil holandês em Pernambuco e ficou associado a obras urbanas”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual foi uma consequência da mineração no século XVIII?",["Crescimento urbano no interior","Fim imediato da escravidão","Proclamação da República","Transferência da capital para Brasília"],0,"A mineração estimulou vilas, comércio e deslocamentos populacionais para o interior.","Para resolver “Qual foi uma consequência da mineração no século XVIII”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["O que era o quinto do ouro?",["Imposto de 20% sobre o ouro extraído","Um prêmio aos mineradores","Uma moeda indígena","Um tratado com a Espanha"],0,"O quinto correspondia a um quinto da produção de ouro destinado à Coroa portuguesa.","Para resolver “O que era o quinto do ouro”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["O que eram as Casas de Fundição?",["Locais onde o ouro era fundido e tributado","Escolas de navegação","Tribunais eleitorais","Portos militares"],0,"As Casas de Fundição ajudavam a controlar e cobrar impostos sobre o ouro.","Para resolver “O que eram as Casas de Fundição”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual movimento de 1789 ocorreu em Minas Gerais?",["Inconfidência Mineira","Revolta da Vacina","Cabanagem","Revolução de 1930"],0,"A Inconfidência Mineira foi um movimento conspiratório contra a dominação portuguesa e a cobrança de impostos.","Relacione o nome do movimento ao lugar e ao contexto político em que ocorreu."],["Qual personagem ficou conhecido como Tiradentes?",["Joaquim José da Silva Xavier","José Bonifácio","Bento Gonçalves","Padre Cícero"],0,"Tiradentes participou da Inconfidência Mineira e foi executado em 1792.","Foi um movimento conspiratório no século XVIII, relacionado à cobrança de impostos sobre a mineração."],["Qual revolta de 1798 ocorreu na Bahia e defendia ideias republicanas?",["Conjuração Baiana","Balaiada","Sabinada","Revolta da Chibata"],0,"A Conjuração Baiana teve participação popular e defendia mudanças sociais e políticas.","Relacione o nome do movimento ao lugar e ao contexto político em que ocorreu."],["Qual foi um dos efeitos da transferência da corte portuguesa em 1808?",["Criação de instituições e abertura de atividades econômicas","Fim da monarquia imediatamente","Abolição da escravidão","Início da ditadura militar"],0,"A presença da corte levou à criação de instituições, imprensa e mudanças administrativas.","Reflita sobre o que muda quando a sede de uma monarquia passa a funcionar em sua colônia."],["Qual instituição cultural foi criada no Rio de Janeiro em 1810?",["Biblioteca Real","TSE","Petrobras","Universidade de Brasília"],0,"A Biblioteca Real, trazida e organizada após a chegada da corte, contribuiu para a vida cultural.","Para resolver “Qual instituição cultural foi criada no Rio de Janeiro em 1810”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["O que foi elevado a Reino Unido com Portugal em 1815?",["Brasil","Uruguai","Argentina","Angola"],0,"Em 1815, o Brasil foi elevado à condição de Reino Unido a Portugal e Algarves.","Para resolver “O que foi elevado a Reino Unido com Portugal em 1815”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Quem era o príncipe regente que permaneceu no Brasil em 1822?",["D. Pedro","D. Miguel","D. João VI","D. Pedro II"],0,"D. Pedro permaneceu no Brasil após o retorno de D. João VI a Portugal.","Para resolver “Quem era o príncipe regente que permaneceu no Brasil em 1822”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["O que significou o Dia do Fico, em janeiro de 1822?",["D. Pedro decidiu permanecer no Brasil","A abolição da escravidão","A fundação de Brasília","A proclamação da República"],0,"D. Pedro anunciou que ficaria no Brasil, contrariando ordens das Cortes portuguesas.","Para resolver “O que significou o Dia do Fico, em janeiro de 1822”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual atividade usou intensamente mão de obra escravizada nas regiões mineradoras?",["Extração de ouro","Produção de computadores","Indústria de automóveis","Cultivo de soja mecanizado"],0,"A mineração colonial também dependia amplamente do trabalho escravizado.","Para resolver “Qual atividade usou intensamente mão de obra escravizada nas regiões mineradoras”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["O que foi o sistema de plantation?",["Grande propriedade com monocultura voltada à exportação","Pequena indústria urbana","Sistema de eleições","Rede de escolas públicas"],0,"Plantation é associado a grandes propriedades, monocultura e trabalho coercitivo, frequentemente escravizado.","Para resolver “O que foi o sistema de plantation”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual cultura agrícola ganhou destaque no Maranhão e Grão-Pará em diferentes períodos coloniais?",["Algodão e arroz","Cacau exclusivamente industrial","Café em estufas","Trigo em larga escala no sertão"],0,"Algodão e arroz tiveram importância econômica em áreas do Norte e Nordeste colonial.","Pense em produtos agrícolas tropicais cultivados no Norte e Nordeste, especialmente para exportação."],["Qual tratado de 1750 redefiniu fronteiras entre Portugal e Espanha na América?",["Tratado de Madri","Tratado de Versalhes","Tratado de Tordesilhas de 1494","Tratado de Utrecht de 1919"],0,"O Tratado de Madri procurou ajustar fronteiras com base na ocupação efetiva de territórios.","Para resolver “Qual tratado de 1750 redefiniu fronteiras entre Portugal e Espanha na América”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual tratado de 1494 dividiu áreas de expansão ultramarina entre Portugal e Espanha?",["Tratado de Tordesilhas","Tratado de Madri","Tratado de Paris","Tratado de Petrópolis"],0,"O Tratado de Tordesilhas estabeleceu uma linha de demarcação entre as áreas reivindicadas pelas coroas ibéricas.","Para resolver “Qual tratado de 1494 dividiu áreas de expansão ultramarina entre Portugal e Espanha”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual foi uma consequência do tráfico atlântico de pessoas escravizadas?",["Diáspora africana e profundas consequências sociais","Fim das desigualdades","Industrialização imediata","Independência em 1500"],0,"O tráfico provocou deslocamentos forçados em massa e marcou profundamente a sociedade brasileira.","Para resolver “Qual foi uma consequência do tráfico atlântico de pessoas escravizadas”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual região foi central na produção açucareira colonial?",["Nordeste, especialmente Pernambuco e Bahia","Planalto Central","Pampa","Vale do Itajaí exclusivamente"],0,"Pernambuco e Bahia foram importantes centros açucareiros.","Considere a região, o período e se a produção era voltada ao consumo local ou à exportação."],["Qual era a função dos engenhos de açúcar?",["Processar a cana para produzir açúcar","Fundir ouro","Construir navios de guerra","Imprimir papel-moeda"],0,"Os engenhos reuniam instalações para moer a cana e fabricar açúcar.","Lembre-se dos engenhos, das grandes propriedades e da produção voltada ao mercado externo."],["O que foi a Guerra dos Emboabas?",["Conflito ligado ao controle das áreas de mineração","Guerra pela Independência em 1822","Conflito da República Velha","Guerra do Paraguai"],0,"A disputa envolveu paulistas e outros grupos pelo controle das minas no início do século XVIII.","Identifique o período, os grupos envolvidos e o motivo central do conflito antes de escolher."],["Qual revolta ocorreu no Maranhão entre 1838 e 1841, já no período regencial?",["Balaiada","Inconfidência Mineira","Conjuração Baiana","Revolta da Vacina"],0,"A Balaiada ocorreu no período regencial, após a Independência, e não durante o período colonial.","Relacione o nome do movimento ao lugar e ao contexto político em que ocorreu."],["Qual foi uma característica do pacto colonial?",["A metrópole controlava o comércio da colônia","A colônia tinha plena autonomia comercial","Não havia impostos","O Brasil controlava Portugal"],0,"O sistema colonial buscava beneficiar a metrópole e restringir o comércio colonial.","Para resolver “Qual foi uma característica do pacto colonial”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual cidade tornou-se capital em 1763?",["Rio de Janeiro","Salvador","Belém","São Luís"],0,"A capital foi transferida de Salvador para o Rio de Janeiro, em parte pela importância do Centro-Sul e da mineração.","Para resolver “Qual cidade tornou-se capital em 1763”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["O que era a derrama, associada à mineração?",["Cobrança forçada de impostos atrasados","Distribuição gratuita de terras","Uma festa religiosa","Um acordo de independência"],0,"A derrama era uma cobrança coercitiva de tributos em atraso, temida na região mineradora.","Para resolver “O que era a derrama, associada à mineração”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual produto era extraído e comercializado na Amazônia colonial?",["Drogas do sertão","Carvão mineral em larga escala","Petróleo refinado","Automóveis"],0,"As chamadas drogas do sertão incluíam especiarias, plantas e produtos florestais amazônicos.","Para resolver “Qual produto era extraído e comercializado na Amazônia colonial”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual foi o papel dos quilombos na história colonial?",["Comunidades de resistência à escravidão","Tribunais portugueses","Companhias de comércio europeias","Fortificações holandesas exclusivamente"],0,"Quilombos foram comunidades formadas por pessoas que resistiam à escravidão, com experiências diversas.","Pense em comunidades formadas por pessoas que resistiam à escravidão e construíam formas próprias de organização."],["Qual quilombo tornou-se símbolo de resistência no período colonial?",["Quilombo dos Palmares","Canudos","Contestado","Caldeirão"],0,"Palmares foi uma das mais conhecidas comunidades de resistência, localizada na região da atual Alagoas.","Pense em comunidades formadas por pessoas que resistiam à escravidão e construíam formas próprias de organização."],["Quem foi Zumbi dos Palmares?",["Liderança associada à resistência de Palmares","Governador-geral","Imperador do Brasil","Primeiro presidente"],0,"Zumbi tornou-se símbolo da resistência negra à escravidão.","Pense em comunidades formadas por pessoas que resistiam à escravidão e construíam formas próprias de organização."],["Qual foi a principal língua oficial da administração colonial portuguesa?",["Português","Tupi antigo exclusivamente","Latim","Holandês"],0,"O português foi a língua da administração colonial, embora muitas línguas indígenas continuassem vivas e usadas.","Para resolver “Qual foi a principal língua oficial da administração colonial portuguesa”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual instituição representava o poder local em muitas vilas coloniais?",["Câmara municipal","Supremo Tribunal Federal","Congresso Nacional republicano","Banco Central"],0,"As câmaras municipais eram instituições locais de governo, geralmente dominadas por elites.","Para resolver “Qual instituição representava o poder local em muitas vilas coloniais”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["O que eram sesmarias?",["Concessões de terras para ocupação e cultivo","Impostos sobre o ouro","Navios de guerra","Cartas de alforria"],0,"Sesmarias eram concessões de terras usadas pela Coroa para estimular ocupação e produção.","Para resolver “O que eram sesmarias”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."],["Qual evento marcou o fim do período colonial e a separação política de Portugal?",["Independência do Brasil em 1822","Proclamação da República em 1889","Abolição em 1888","Constituição de 1988"],0,"A Independência de 1822 marcou a ruptura política, embora estruturas sociais coloniais tenham permanecido.","Para resolver “Qual evento marcou o fim do período colonial e a separação política de Portugal”, pense na organização da colônia, na economia de exportação e nas relações com Portugal."]]},{"name":"Império do Brasil","dates":"1822–1889","questions":[["Em que ano foi proclamada a Independência do Brasil?",["1808","1822","1831","1889"],1,"A Independência foi proclamada em 7 de setembro de 1822, sob liderança de Pedro de Alcântara, futuro D. Pedro I.","Lembre-se do processo de ruptura política com Portugal e do episódio ocorrido às margens de um riacho em let phase=0,idx=0,score=0,lives=4,selected=-1,locked=false,phaseCorrect=0;
let phaseUnlocked=[true,false,false],roundQuestions=[],phaseResults=[null,null,null];
const $=id=>document.getElementById(id);
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawQuestions(){roundQuestions=shuffle(phases[phase].questions).slice(0,10)}
function render(){
 const p=phases[phase],q=roundQuestions[idx];selected=-1;locked=false;
 $("phaseLabel").textContent=`Fase ${phase+1} — ${p.name}`;
 $("question").textContent=q[0];$("progress").textContent=`${idx+1}/10`; $("hintText").textContent=""; $("hintText").classList.add("hidden"); $("hintBtn").disabled=false;
 $("score").textContent=score;$("lives").textContent=lives;$("answers").replaceChildren();
 q[1].forEach((answer,i)=>{const b=document.createElement("button");b.type="button";b.className="answer";const letter=document.createElement("span");letter.className="letter";letter.textContent="ABCD"[i];const label=document.createElement("span");label.textContent=answer;b.append(letter,label);b.addEventListener("click",()=>choose(i));$("answers").appendChild(b)});
 $("feedback").textContent="Escolha uma alternativa e toque em “Confirmar resposta”.";
 $("confirmBtn").classList.remove("hidden");$("confirmBtn").disabled=true;$("nextBtn").classList.add("hidden");$("phaseBtn").classList.add("hidden");$("stopBtn").classList.add("hidden");$("restartBtn").classList.add("hidden");
 $("backBtn").disabled=idx===0&&phase===0;
 document.querySelectorAll(".phase").forEach((b,i)=>{b.classList.toggle("active",i===phase);b.disabled=!phaseUnlocked[i];b.innerHTML=`Fase ${i+1}<br>${phases[i].name}${phaseUnlocked[i]?"":" 🔒"}`});
}
function choose(i){if(locked)return;selected=i;[...$("answers").children].forEach((b,j)=>b.classList.toggle("selected",i===j));$("confirmBtn").disabled=false}
function confirmAnswer(){
 if(selected<0||locked)return;
 locked=true;
 const q=roundQuestions[idx],ok=selected===q[2];
 [...$("answers").children].forEach((b,i)=>{
   b.disabled=true;
   if(i===q[2])b.classList.add("correct");
   if(i===selected&&!ok)b.classList.add("wrong");
 });
 if(ok){
   score+=10;phaseCorrect++;
   $("feedback").textContent="✅ Correto! "+q[3];
 }else{
   lives--;
   $("feedback").textContent="❌ Resposta correta: "+q[1][q[2]]+". "+q[3];
 }
 $("score").textContent=score;
 $("lives").textContent=lives;
 $("confirmBtn").classList.add("hidden");
 if(lives<=0){
   phaseResults[phase]={correct:phaseCorrect,score:phaseCorrect*10,percent:phaseCorrect*10,passed:phaseCorrect>=7};
   $("feedback").textContent+=" Você ficou sem vidas. Resultado desta tentativa: "+phaseCorrect+"/10. Você pode refazer a fase.";
   $("restartBtn").textContent="Refazer esta fase";
   $("restartBtn").classList.remove("hidden");
   return;
 }
 if(idx<9){
   $("nextBtn").classList.remove("hidden");
 }else{
   finishPhase();
 }
}
function finishPhase(){
 const passed=phaseCorrect>=7;
 phaseResults[phase]={correct:phaseCorrect,score:phaseCorrect*10,percent:phaseCorrect*10,passed};
 const scoreText=`Fase ${phase+1}: ${phaseCorrect}/10 acertos — ${phaseCorrect*10}%.`;
 if(!passed){
   $("feedback").textContent=scoreText+" Você precisa de pelo menos 7 acertos (70%) para avançar. Quer tentar esta fase novamente?";
   $("restartBtn").textContent="Refazer esta fase";
   $("restartBtn").classList.remove("hidden");
   return;
 }
 if(phase<2){
   phaseUnlocked[phase+1]=true;
   $("feedback").textContent=scoreText+" Você atingiu a média! Quer continuar para a próxima fase ou encerrar por aqui e ver seu resultado?";
   $("phaseBtn").textContent="Continuar para a próxima fase →";
   $("phaseBtn").classList.remove("hidden");
   $("stopBtn").classList.remove("hidden");
 }else{
   showFinalResults();
 }
}
function showFinalResults(){
 const completed=phaseResults.filter(Boolean);
 const totalCorrect=completed.reduce((sum,r)=>sum+r.correct,0);
 const average=completed.length ? Math.round(completed.reduce((sum,r)=>sum+r.percent,0)/completed.length) : 0;
 const lines=phaseResults.map((r,i)=>r?`Fase ${i+1}: ${r.correct}/10 (${r.percent}%)`:`Fase ${i+1}: não realizada`);
 $("phaseLabel").textContent="Resultado da jornada";
 $("question").textContent="Parabéns por jogar!";
 $("answers").replaceChildren();
 $("feedback").textContent=lines.join(" • ") + ` | Média das fases concluídas: ${average}% (${totalCorrect} acertos no total).`;
 $("confirmBtn").classList.add("hidden");
 $("nextBtn").classList.add("hidden");
 $("phaseBtn").classList.add("hidden");
 $("stopBtn").classList.add("hidden");
 $("restartBtn").textContent="Jogar novamente";
 $("restartBtn").classList.remove("hidden");
}
function stopAndShowResults(){
 showFinalResults();
}
function next(){if(idx<9){idx++;render()}}
function nextPhase(){phase++;idx=0;lives=4;phaseCorrect=0;drawQuestions();render()}
$("hintBtn").addEventListener("click",()=>{const q=roundQuestions[idx];$("hintText").textContent="💡 "+q[4];$("hintText").classList.remove("hidden");$("hintBtn").disabled=true});
$("confirmBtn").addEventListener("click",confirmAnswer);$("nextBtn").addEventListener("click",next);$("phaseBtn").addEventListener("click",nextPhase);$("stopBtn").addEventListener("click",stopAndShowResults);
$("backBtn").addEventListener("click",()=>{if(idx>0){idx--;render()}else if(phase>0){phase--;idx=9;render()}});
$("restartBtn").addEventListener("click",()=>{phase=0;idx=0;score=0;lives=4;phaseCorrect=0;phaseUnlocked=[true,false,false];phaseResults=[null,null,null];drawQuestions();render()});
$("helpBtn").addEventListener("click",()=>alert("Como jogar:\\n1. Escolha uma das quatro alternativas.\\n2. Confirme a resposta para ver a explicação.\\n3. Cada acerto vale 10 pontos.\\n4. Você tem 4 vidas por fase e precisa acertar pelo menos 7 das 10 perguntas para passar (70%). Ao final, escolha se quer continuar ou parar e ver o resultado. Ao concluir as três fases, o jogo calcula a média. A dica orienta sem revelar a resposta.\\n5. Cada partida sorteia 10 perguntas diferentes entre 50 da fase."));
document.querySelectorAll(".phase").forEach(b=>b.addEventListener("click",()=>{const n=Number(b.dataset.phase);if(phaseUnlocked[n]){phase=n;idx=0;lives=4;phaseCorrect=0;drawQuestions();render()}}));
drawQuestions();render();
</script></body></html>
